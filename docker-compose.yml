services:
  esp32-http-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esp32_http_lab
    restart: unless-stopped
    ports:
      # Publica el puerto en el host: http://IP_DEL_SERVIDOR:3000
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
